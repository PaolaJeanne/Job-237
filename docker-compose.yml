#
#  Activation le jour du passage en production :
#    1. Dans le .env de production :
#         DJANGO_USE_POSTGRES=True
#         POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_HOST=db
#         DJANGO_ENV=production
#         DJANGO_DEBUG=False
#         DJANGO_SECRET_KEY=<vraie valeur>
#         DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
